server {
    listen 80;

    # Docker's internal DNS: service names are resolved at request time, so nginx
    # starts even when a service is down and follows containers that restart
    resolver 127.0.0.11 valid=10s;

    # Compiled Angular app
    root /usr/share/nginx/html;
    index index.html;

    # Health checks of the backend services (infrastructure, not part of the API)
    location = /health/catalog {
        set $catalog http://catalog-service:8080;
        proxy_pass $catalog/health;
    }

    location = /health/library {
        set $library http://library-service:8080;
        proxy_pass $library/health;
    }

    # Angular routes (e.g. /games/42) are not real files: serve index.html and
    # let the Angular router show the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
